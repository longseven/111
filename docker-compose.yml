# 一键起服务：docker compose up -d  →  http://127.0.0.1:8000
# 配置可走两条路：① .env 文件（见 .env.example）；② 启动后在页面「⚙ 设置」里在线填。
# 无需登录，开箱即用。
services:
  app:
    build: .
    image: k12-adapt:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
